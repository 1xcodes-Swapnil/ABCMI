version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: abcimi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-abcimi_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-abcimi_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - abcimi_network

  redis:
    image: redis:7-alpine
    container_name: abcimi_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - abcimi_network

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: abcimi_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - abcimi_network

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: abcimi_backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8000
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-abcimi_db}
      REDIS_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      AUDIO_STORAGE_PATH: /app/data/audio
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ..:/app
      - ../data/audio:/app/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - abcimi_network

  frontend:
    image: node:20-alpine
    container_name: abcimi_frontend
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ..:/app
    depends_on:
      backend:
        condition: service_started
    networks:
      - abcimi_network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  abcimi_network:
    driver: bridge
