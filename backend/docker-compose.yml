version: "3.8"

services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: abcimi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-abcimi_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-abcimi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - abcimi_network

  # ============================================================================
  # 2. Redis Service (Transient state, caching, event bus, blackboard pub/sub)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: abcimi_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - abcimi_network

  # ============================================================================
  # 3. Qdrant Vector Database (Semantic memory & SKW vector storage)
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: abcimi_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333" # REST API & Web UI Dashboard
      - "${QDRANT_GRPC_PORT:-6334}:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - abcimi_network

  # ============================================================================
  # 4. ABCI-MI FastAPI Backend Service
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abcimi_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8000
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-abcimi_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      AUDIO_STORAGE_PATH: /app/data/audio
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - .:/app
      - audio_data:/app/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - abcimi_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  audio_data:
    driver: local

networks:
  abcimi_network:
    driver: bridge
